name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}, ${{ matrix.stability }}${{ matrix.phpunit && format(', PHPUnit {0}', matrix.phpunit) || '' }}${{ matrix.math && format(', {0}', matrix.math) || '' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12', '13']
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: '12'
            testbench: '10'
          - laravel: '13'
            testbench: '11'
          # PHPUnit 13 needs PHP 8.4.1 or newer. Older PHP versions get PHPUnit 11 or 12.
          - php: '8.4'
            phpunit: '13'
          - php: '8.5'
            phpunit: '13'
          # Hashids uses GMP if it is loaded. This job tests BCMath without GMP.
          - php: '8.4'
            laravel: '13'
            stability: prefer-stable
            math: bcmath
        exclude:
          - laravel: '13'
            php: '8.2'

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.math == 'bcmath' && 'bcmath, :gmp' || 'bcmath, gmp' }}
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:^${{ matrix.laravel }}.0" "orchestra/testbench:^${{ matrix.testbench }}.0" ${{ matrix.phpunit && format('"phpunit/phpunit:^{0}.0"', matrix.phpunit) || '' }} --dev --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Check the math extensions
        env:
          EXPECT_GMP: ${{ matrix.math == 'bcmath' && '0' || '1' }}
        run: |
          php -r '
            $gmp = extension_loaded("gmp");
            echo "bcmath=", (int) extension_loaded("bcmath"), " gmp=", (int) $gmp, PHP_EOL;
            if (! extension_loaded("bcmath")) { fwrite(STDERR, "BCMath is not loaded.\n"); exit(1); }
            if ($gmp !== (getenv("EXPECT_GMP") === "1")) { fwrite(STDERR, "GMP must be loaded only if EXPECT_GMP is 1.\n"); exit(1); }
          '

      - name: Run tests
        run: vendor/bin/phpunit

  js:
    name: Card build and tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Check that dist matches the sources
        run: |
          npm run prod
          git diff --exit-code -- dist
